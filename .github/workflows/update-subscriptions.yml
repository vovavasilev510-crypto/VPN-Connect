name: Update VPN subscriptions
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: write
concurrency:
  group: vpn-subscriptions
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Refresh and validate both sources
        shell: pwsh
        run: ./.vpn-connect/runtime/Update-PublicSubscriptions.ps1 -Root . -StageChanges
      - name: Commit updated subscriptions
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public VPN subscriptions'
            git push
          fi
